# =============================================================================
# Casual Friday Theme - Example Configuration
# =============================================================================
# This is a complete example hugo.toml showing all available theme options.
# Copy this file to your site root and customise as needed.
# =============================================================================

baseURL = "https://example.com/"
title = "Avijit ~ Ajay"
theme = "casual-friday"
languageCode = "en-gb"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

# =============================================================================
# Theme Parameters
# =============================================================================
[params]
  description = "Security, infrastructure, and the small invisible decisions that decide whether a Tuesday is quiet."

  # ---------------------------------------------------------------------------
  # SEO Settings
  # ---------------------------------------------------------------------------
  author = "Avijit Ajay"
  keywords = ["engineering", "security", "finops", "infrastructure", "leadership"]

  # Optional: tagline appended to homepage title
  # tagline = "Engineering Leadership"

  # Default image for social sharing (used when posts don't have an image)
  # ogImage = "/images/og-default.png"

  # Optional: custom favicon paths
  # favicon = "/favicon.ico"
  # appleTouchIcon = "/apple-touch-icon.png"

  # ---------------------------------------------------------------------------
  # Brand
  # ---------------------------------------------------------------------------
  # Character used to split the site title in the nav (default: "~")
  titleSeparator = "~"

  # ---------------------------------------------------------------------------
  # Hero Section (Homepage)
  # ---------------------------------------------------------------------------
  heroEyebrow = "Engineering leadership · Security · FinOps"
  heroHeadline = "I write about the organisational texture of running ==resilient== systems."
  heroStandfirst = "Security, infrastructure, and the small invisible decisions that decide whether a Tuesday is quiet — or the worst day of the quarter."

  # ---------------------------------------------------------------------------
  # Content Display
  # ---------------------------------------------------------------------------
  # Featured tags shown in mobile tag bar (use tag slugs)
  featuredTags = ["platform", "finops", "security"]

  # Number of latest posts to show on homepage
  latestPostsDesktop = 5   # Desktop view (1 large + N-1 small cards)
  latestPostsMobile = 3    # Mobile view

  # Additional content sections to merge into the homepage feed alongside "posts"
  # homepageSections = ["notes", "essays"]

  # ---------------------------------------------------------------------------
  # Theme Customisation
  # ---------------------------------------------------------------------------
  # Accent colour — used for highlights, buttons, and interactive elements
  # oklch presets: lime (default), amber, coral, sky
  # Legacy hex presets: cerulean, crimson, purple, teal
  # Or use a raw value: "oklch(0.85 0.14 140)" or "#FF5733"
  accentColor = "lime"

  # Page background colour — overrides the default warm parchment (#f4efe4)
  # Accepts any valid CSS colour: hex, oklch, rgb, etc.
  # Leave unset to use the default. Cards/surfaces retain their own colour.
  # backgroundColor = "#e8e0d0"

  # List page layout: "single-column" (default) or "two-column"
  # Timeline spine is always shown on desktop
  listLayout = "single-column"

# ---------------------------------------------------------------------------
# Hero Action Buttons
# ---------------------------------------------------------------------------
[[params.heroLinks]]
  text = "Start here"
  url = "/posts/"
[[params.heroLinks]]
  text = "Browse all essays"
  url = "/tags/"

# ---------------------------------------------------------------------------
# Subscribe CTA (shown in nav bar)
# ---------------------------------------------------------------------------
[params.subscribeCTA]
  text = "Subscribe"
  url = "/subscribe/"

# ---------------------------------------------------------------------------
# Social Links (shown in footer as text links)
# ---------------------------------------------------------------------------
[params.social]
  linkedin = "https://linkedin.com/in/yourprofile"
  github = "https://github.com/yourusername"
  twitter = "https://twitter.com/yourhandle"

# ---------------------------------------------------------------------------
# Audio Player (Optional)
# ---------------------------------------------------------------------------
[params.audio]
  baseURL = "/audio"

# ---------------------------------------------------------------------------
# Analytics (Optional)
# ---------------------------------------------------------------------------
# Analytics only loads in production (not during `hugo server`)
[params.analytics]
  # GoatCounter - privacy-friendly analytics
  # goatcounter = "your-site-code"

  # Google Analytics (GA4)
  # google = "G-XXXXXXXXXX"

# =============================================================================
# Navigation Menu
# =============================================================================
[menu]
  [[menu.main]]
    name = "Essays"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "Now"
    url = "/now/"
    weight = 2
  [[menu.main]]
    name = "Topics"
    url = "/tags/"
    weight = 3
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 4

# =============================================================================
# Outputs
# =============================================================================
[outputs]
  home = ["HTML", "RSS"]

# =============================================================================
# Taxonomies
# =============================================================================
[taxonomies]
  category = "categories"
  tag = "tags"

# =============================================================================
# Markup Settings
# =============================================================================
[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
