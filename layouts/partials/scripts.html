<script>
// =============================================================================
// Mobile Nav Toggle (hamburger + dropdown)
// =============================================================================
(function() {
  var hamburger = document.getElementById('hamburger');
  var dropdown = document.getElementById('nav-dropdown');
  var navPill = document.getElementById('nav-pill');
  if (!hamburger || !dropdown) return;

  hamburger.addEventListener('click', function() {
    hamburger.classList.toggle('open');
    dropdown.classList.toggle('open');
    if (navPill) navPill.classList.toggle('nav-open');
  });

  // Close on dropdown link click
  dropdown.querySelectorAll('.dd-item').forEach(function(link) {
    link.addEventListener('click', function() {
      hamburger.classList.remove('open');
      dropdown.classList.remove('open');
      if (navPill) navPill.classList.remove('nav-open');
    });
  });

  // Close on outside click
  document.addEventListener('click', function(e) {
    if (!hamburger.contains(e.target) && !dropdown.contains(e.target)) {
      hamburger.classList.remove('open');
      dropdown.classList.remove('open');
      if (navPill) navPill.classList.remove('nav-open');
    }
  });
})();

// =============================================================================
// Theme Toggle (uses window.cfTheme from head.html)
// =============================================================================
(function() {
  var GLYPHS = { auto: '◐ Auto', light: '☀ Light', dark: '☾ Dark' };
  var buttons = document.querySelectorAll('[data-theme-toggle]');
  if (!buttons.length || !window.cfTheme) return;

  function updateLabel(mode) {
    buttons.forEach(function(btn) {
      btn.textContent = GLYPHS[mode] || GLYPHS.auto;
    });
  }

  updateLabel(window.cfTheme.get());

  buttons.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var next = window.cfTheme.cycle();
      updateLabel(next);
    });
  });

  window.cfTheme.onChange(function(detail) {
    updateLabel(detail.mode);
  });
})();

// =============================================================================
// Homepage Carousel (Featured tab)
// =============================================================================
(function() {
  var body = document.getElementById('carousel-body');
  if (!body) return;

  var tagsEl = document.getElementById('c-tags');
  var titleEl = document.getElementById('c-title-text');
  var excerptEl = document.getElementById('c-excerpt');
  var metaEl = document.getElementById('c-meta');
  var dotsEl = document.getElementById('c-dots');
  var nextUpEl = document.getElementById('c-next');
  var prevBtn = document.getElementById('arrow-prev');
  var nextBtn = document.getElementById('arrow-next');

  // POSTS is injected by the homepage template as a JSON array
  if (typeof POSTS === 'undefined' || !POSTS.length) return;

  var current = 0;

  function decodeEntities(str) {
    var el = document.createElement('textarea');
    el.innerHTML = str;
    return el.value;
  }

  function render(index) {
    var post = POSTS[index];
    if (!post) return;

    // Fade out
    body.style.opacity = '0';
    body.style.transform = 'translateY(5px)';

    setTimeout(function() {
      // Tags
      if (tagsEl) {
        tagsEl.innerHTML = '';
        (post.tags || []).forEach(function(tag) {
          var span = document.createElement('span');
          span.className = 'carousel-tag';
          span.textContent = tag;
          tagsEl.appendChild(span);
        });
      }

      // Title
      if (titleEl) titleEl.textContent = post.title || '';

      // Excerpt
      if (excerptEl) excerptEl.textContent = decodeEntities(post.excerpt || '');

      // Meta
      if (metaEl) metaEl.textContent = (post.date || '') + ' · ' + (post.readTime || '') + ' read';

      // Next up
      var nextPost = POSTS[(index + 1) % POSTS.length];
      if (nextUpEl && nextPost) nextUpEl.textContent = nextPost.title;

      // Link
      var titleLink = body.querySelector('.carousel-title');
      if (titleLink && post.url) titleLink.href = post.url;

      // Dots
      if (dotsEl) {
        dotsEl.innerHTML = '';
        POSTS.forEach(function(_, i) {
          var dot = document.createElement('button');
          dot.className = i === index ? 'dot-active' : 'dot-inactive';
          dot.setAttribute('aria-label', 'Slide ' + (i + 1));
          dot.addEventListener('click', function() { current = i; render(i); });
          dotsEl.appendChild(dot);
        });
      }

      // Fade in
      body.style.opacity = '1';
      body.style.transform = 'translateY(0)';
    }, 180);
  }

  if (prevBtn) prevBtn.addEventListener('click', function() {
    current = (current - 1 + POSTS.length) % POSTS.length;
    render(current);
  });
  if (nextBtn) nextBtn.addEventListener('click', function() {
    current = (current + 1) % POSTS.length;
    render(current);
  });

  render(0);

  // Tab switching (Featured / Now)
  document.querySelectorAll('.tab-btn').forEach(function(tab) {
    tab.addEventListener('click', function() {
      var target = tab.getAttribute('data-tab');
      document.querySelectorAll('.tab-btn').forEach(function(t) {
        t.className = 'tab-btn ' + (t.getAttribute('data-tab') === target ? 'tab-active' : 'tab-inactive');
      });
      document.querySelectorAll('.panel-view').forEach(function(v) {
        v.classList.toggle('active', v.getAttribute('data-panel') === target);
      });
    });
  });
})();

// =============================================================================
// Audio Player
// =============================================================================
(function() {
  var speedOptions = [0.75, 1, 1.25, 1.5, 2];

  function formatTime(seconds) {
    if (isNaN(seconds) || seconds < 0) return '0:00';
    var mins = Math.floor(seconds / 60);
    var secs = Math.floor(seconds % 60);
    return mins + ':' + (secs < 10 ? '0' : '') + secs;
  }

  document.querySelectorAll('.ap-container').forEach(function(container) {
    var cta = container.querySelector('.ap-cta');
    var player = container.querySelector('.ap-player');
    var audio = container.querySelector('audio');
    if (!audio) return;

    var playBtn = container.querySelector('.ap-play');
    var timeCurrent = container.querySelector('.ap-time-current');
    var timeTotal = container.querySelector('.ap-time-total');
    var barWrap = container.querySelector('.ap-bar-wrap');
    var barFill = container.querySelector('.ap-bar-fill');
    var handle = container.querySelector('.ap-handle');
    var speedBtn = container.querySelector('.ap-speed');

    var currentSpeedIndex = 1;

    if (cta && player) {
      cta.addEventListener('click', function() {
        cta.style.display = 'none';
        player.style.display = 'flex';
        audio.play().catch(function() {});
      });
    }

    if (playBtn) {
      playBtn.addEventListener('click', function() {
        if (audio.paused) { audio.play(); } else { audio.pause(); }
      });
    }

    audio.addEventListener('play', function() {
      if (playBtn) playBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
    });
    audio.addEventListener('pause', function() {
      if (playBtn) playBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>';
    });

    audio.addEventListener('timeupdate', function() {
      if (!audio.duration) return;
      var pct = (audio.currentTime / audio.duration) * 100;
      if (barFill) barFill.style.width = pct + '%';
      if (handle) handle.style.left = pct + '%';
      if (timeCurrent) timeCurrent.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', function() {
      if (timeTotal) timeTotal.textContent = formatTime(audio.duration);
    });

    function seekTo(e) {
      if (!barWrap || !audio.duration) return;
      var rect = barWrap.getBoundingClientRect();
      var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audio.currentTime = pct * audio.duration;
    }

    if (barWrap) {
      var dragging = false;
      barWrap.addEventListener('click', seekTo);
      barWrap.addEventListener('mousedown', function(e) { dragging = true; seekTo(e); });
      document.addEventListener('mousemove', function(e) { if (dragging) seekTo(e); });
      document.addEventListener('mouseup', function() { dragging = false; });
      barWrap.addEventListener('touchstart', function(e) { dragging = true; seekTo({ clientX: e.touches[0].clientX }); });
      barWrap.addEventListener('touchmove', function(e) { if (dragging) seekTo({ clientX: e.touches[0].clientX }); });
      barWrap.addEventListener('touchend', function() { dragging = false; });
      barWrap.addEventListener('keydown', function(e) {
        var step = audio.duration * 0.05;
        if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { audio.currentTime = Math.min(audio.duration, audio.currentTime + step); e.preventDefault(); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { audio.currentTime = Math.max(0, audio.currentTime - step); e.preventDefault(); }
      });
    }

    if (speedBtn) {
      speedBtn.addEventListener('click', function() {
        currentSpeedIndex = (currentSpeedIndex + 1) % speedOptions.length;
        var s = speedOptions[currentSpeedIndex];
        audio.playbackRate = s;
        speedBtn.textContent = s === 1 ? '1x' : s + 'x';
      });
    }

    audio.addEventListener('ended', function() {
      if (barFill) barFill.style.width = '0%';
      if (handle) handle.style.left = '0%';
      if (timeCurrent) timeCurrent.textContent = '0:00';
    });
  });
})();

// =============================================================================
// Code Copy Button
// =============================================================================
(function() {
  document.querySelectorAll('pre > code').forEach(function(codeBlock) {
    var pre = codeBlock.parentElement;

    var copyBtn = document.createElement('button');
    copyBtn.className = 'code-copy-btn';
    copyBtn.setAttribute('aria-label', 'Copy code to clipboard');
    copyBtn.innerHTML = '<svg class="icon-copy" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><svg class="icon-check" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polyline points="20 6 9 17 4 12"></polyline></svg>';

    var wrapper = document.createElement('div');
    wrapper.className = 'code-block-wrapper';
    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(pre);
    wrapper.appendChild(copyBtn);

    copyBtn.addEventListener('click', function() {
      var code = codeBlock.textContent;
      navigator.clipboard.writeText(code).then(function() {
        var iconCopy = copyBtn.querySelector('.icon-copy');
        var iconCheck = copyBtn.querySelector('.icon-check');
        iconCopy.style.display = 'none';
        iconCheck.style.display = 'block';
        copyBtn.classList.add('copied');
        setTimeout(function() {
          iconCopy.style.display = 'block';
          iconCheck.style.display = 'none';
          copyBtn.classList.remove('copied');
        }, 2000);
      }).catch(function() {
        var ta = document.createElement('textarea');
        ta.value = code;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); copyBtn.classList.add('copied'); setTimeout(function() { copyBtn.classList.remove('copied'); }, 2000); } catch (e) {}
        document.body.removeChild(ta);
      });
    });
  });
})();

// =============================================================================
// TOC Scroll Spy
// =============================================================================
(function() {
  var tocSidebar = document.querySelector('.toc-sidebar');
  if (!tocSidebar) return;

  var tocItems = tocSidebar.querySelectorAll('#TableOfContents li, .toc-item');
  var tocLinks = tocSidebar.querySelectorAll('#TableOfContents li a, .toc-item a');
  if (!tocLinks.length) return;

  var headingIds = Array.from(tocLinks).map(function(link) {
    var href = link.getAttribute('href');
    return href ? href.slice(1) : null;
  }).filter(Boolean);

  var headings = headingIds.map(function(id) { return document.getElementById(id); }).filter(Boolean);
  if (!headings.length) return;

  var lastTime = 0;
  function updateActive() {
    var now = Date.now();
    if (now - lastTime < 100) return;
    lastTime = now;

    var scrollY = window.scrollY;
    var activeId = null;

    for (var i = headings.length - 1; i >= 0; i--) {
      if (scrollY >= headings[i].getBoundingClientRect().top + scrollY - 100) {
        activeId = headings[i].id;
        break;
      }
    }

    if (!activeId && headings.length) activeId = headings[0].id;

    tocItems.forEach(function(item) {
      var link = item.querySelector('a');
      if (link && link.getAttribute('href') === '#' + activeId) {
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });
  }

  window.addEventListener('scroll', updateActive, { passive: true });
  updateActive();
})();

// =============================================================================
// Terms Accordion (mobile)
// =============================================================================
(function() {
  document.querySelectorAll('.terms-accordion-toggle').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var expanded = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!expanded));
      var item = btn.closest('.terms-accordion-item');
      var body = item && item.querySelector('.terms-accordion-body');
      if (body) body.classList.toggle('open');
    });
  });
})();
</script>
